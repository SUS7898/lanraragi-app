name: Release

# Builds a signed release APK and publishes it (with SHA256SUMS.txt) as a GitHub Release.
# The in-app updater reads `releases/latest`, so every tag v* becomes an update for users.
#
# Required repository secrets:
#   KEYSTORE_BASE64   base64 of the release keystore (.jks)  -> scripts/generate-keystore.sh prints it
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          NAME="${TAG#v}"
          CORE="${NAME%%-*}"
          IFS=. read -r MA MI PA <<< "$CORE"
          CODE=$((MA*1000000 + MI*1000 + PA))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $CODE)"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v (see README.md > 릴리스)"; exit 1; }
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest

      - name: Vulnerability scan (Trivy, blocks on CRITICAL/HIGH with a fix)
        run: ./gradlew --no-daemon :app:lockReleaseDependencies --write-locks --no-configuration-cache
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK signature (v2/v3) and package
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" | tee badging.txt
          grep -q "name='com.sus7898.lrrviewer'" badging.txt
          grep -q "versionName='${{ steps.version.outputs.name }}'" badging.txt
          grep -q "versionCode='${{ steps.version.outputs.code }}'" badging.txt

      - name: Package artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lrr-viewer-${RELEASE_TAG}.apk"
          [ -f app/build/outputs/apk/release/app-release.apk.idsig ] && cp app/build/outputs/apk/release/app-release.apk.idsig "dist/lrr-viewer-${RELEASE_TAG}.apk.idsig" || true
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${RELEASE_TAG}.txt" || true
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          test -s "dist/lrr-viewer-${RELEASE_TAG}.apk" && test -s dist/SHA256SUMS.txt
          # Signing certificate fingerprint for the README / manual verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/lrr-viewer-${RELEASE_TAG}.apk" | grep -i "SHA-256" > dist/SIGNING-CERT.txt || true
          cat dist/SIGNING-CERT.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/lrr-viewer-${{ env.RELEASE_TAG }}.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT.txt
            dist/*.idsig
            dist/mapping-*.txt
