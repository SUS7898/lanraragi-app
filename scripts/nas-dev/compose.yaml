# 사용: NAS에 SSH 접속 후 이 폴더에서  sudo docker compose up -d --build
services:
  claude:
    build:
      context: .
      args:
        UID: "1026"          # NAS에서 `id -u` 값으로 바꿀 것
    container_name: claude-dev
    restart: unless-stopped
    init: true               # 남는 Gradle/Kotlin 데몬 프로세스 회수
    command: sleep infinity
    # 자원 상한: NAS(DSM·LANraragi·Jellyfin 등)가 빌드 중에도 응답하도록.
    # 실측(2026-11-08): 17Gi 중 기존 컨테이너 10개가 ~6Gi 사용, available 9.5Gi, 스왑 이미 3.9Gi 사용 중
    # → 6g 로 제한하고 스왑은 못 쓰게(memswap=mem) 한다. 넘으면 NAS 전체가 스왑으로 느려지는 대신
    #   이 컨테이너 안의 빌드만 OOM 으로 죽는다. Android 빌드와 Librario 작업을 동시에 돌리지 말 것.
    mem_limit: 6g
    memswap_limit: 6g
    cpus: "3"                # 4코어 중 1코어는 NAS 몫
    labels:
      # 로컬에서 빌드한 이미지라 레지스트리에 없다 → watchtower 가 갱신을 시도하지 않게
      com.centurylinklabs.watchtower.enable: "false"
    pids_limit: 4096
    shm_size: 1g             # 헤드리스 Chrome이 기본 /dev/shm(64MB)에서 죽는 것 방지
    # 보안: 일반 사용자(dev)로 실행, 권한 상승 금지, 포트 공개 없음(바깥으로 나가는 연결만)
    security_opt:
      - no-new-privileges:true
    # 새 Docker 네트워크를 만들지 않고 기본 bridge(docker0)를 쓴다. compose 프로젝트마다 새 대역을 잡다가
    # 172.17~31 이 다 차면 192.168.x.0/20 을 쓰는데, 그게 집 LAN 대역과 겹치면 NAS 접속이 끊긴다.
    network_mode: bridge
    environment:
      TZ: Asia/Seoul
    volumes:
      - /volume1/docker/claude/dev/home:/home/dev   # Claude 로그인·설정, git 자격 증명, ~/.gradle 캐시
      - /volume1/docker/claude/dev/work:/work       # 저장소 체크아웃
    # 마운트하지 않는 것: docker.sock(=NAS root 권한), LANraragi 데이터, 서명 키(keystore), 다른 공유 폴더.
